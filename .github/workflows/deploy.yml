name: Build and Deploy CVE.ICU

on:
  # Run on push to main branch
  push:
    branches: [ main ]
  
  # Primary trigger: nvd-scrapper sends this right after it publishes a new
  # snapshot and purges the CDN, so the site rebuilds within minutes of fresh
  # data instead of waiting on the cron below. It only fires on a clean
  # publish, so a run the producer refused never triggers a rebuild here.
  repository_dispatch:
    types: [nvd-published]

  # Hourly backup, kept because the dispatch above depends on a token in
  # another repo. Offset from :00 because scheduled workflows on the hour sit in
  # the most contended slot on GitHub Actions and are frequently delayed or dropped.
  schedule:
    - cron: '25 * * * *'
  
  # Allow manual triggering
  workflow_dispatch:

# A run commits to main and pushes. A dispatch and the hourly cron can land
# close together, and a slow run can still be in flight when the next fires,
# so serialise rather than race the push.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # Check out the branch tip as of job start, not the SHA the event was
    # created at. A dispatch or cron that queues behind a running build
    # would otherwise start from a main that the running build then pushes
    # past, and its "Commit updated data" push is rejected as non-fast-forward.
    # The concurrency group guarantees the previous build has pushed by now.
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        persist-credentials: true
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
        
    - name: Download fresh KEV and EPSS data
      run: |
        cd data && python -c "
        from download_cve_data import CVEDataDownloader
        d = CVEDataDownloader()
        d.download_kev_data(force=True)
        d.parse_kev_json()
        d.download_epss_data(force=True)
        d.parse_epss_csv()
        "
        
    - name: Build site
      run: |
        python build.py --quiet
        
    - name: Validate build output
      run: python build.py validate --quiet

    - name: Copy CNAME for GitHub Pages
      run: cp CNAME web/CNAME
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./web
        publish_branch: gh-pages
        force_orphan: true
        
    # repository_dispatch is the same unattended data refresh as schedule, just
    # triggered on time, so it has to persist web/ the same way.
    - name: Commit updated data
      if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout main
        git add web/
        git diff --staged --quiet || git commit -m "Auto-update CVE data $(date -u +%Y-%m-%dT%H:%MZ)"
        git push
